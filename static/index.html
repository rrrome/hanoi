<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>汉诺塔</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="游戏控制">
        <div>
          <h1>汉诺塔</h1>
          <p id="statusText">加载中...</p>
        </div>

        <div class="controls">
          <label class="field">
            <span>盘子数量</span>
            <input id="diskCount" type="number" min="2" max="16" value="3" />
          </label>
          <button id="newGameButton" type="button">新游戏</button>
          <button id="undoButton" type="button">撤回上一步</button>
          <button id="demoButton" type="button">教学演示</button>
          <div id="demoControls" class="demo-controls" hidden>
            <button id="demoPreviousButton" type="button">上一步</button>
            <span id="demoProgress">0 / 0</span>
            <button id="demoNextButton" type="button">下一步</button>
            <button id="demoExitButton" type="button">退出演示</button>
          </div>
        </div>
      </section>

      <section class="stats" aria-label="游戏统计">
        <div>
          <span>总步数</span>
          <strong id="moveCount">0</strong>
        </div>
        <div>
          <span>总时间</span>
          <strong id="elapsedTime">00:00</strong>
        </div>
        <div>
          <span>最少步数</span>
          <strong id="minimumMoves">7</strong>
        </div>
      </section>

      <section class="board-panel" aria-label="汉诺塔棋盘">
        <canvas id="board" width="1200" height="620"></canvas>
      </section>

      <section id="demoSliderPanel" class="demo-slider-panel" aria-label="教学演示进度" hidden>
        <label for="demoStepSlider">演示进度</label>
        <input id="demoStepSlider" type="range" min="0" max="0" step="1" value="0" />
        <span id="demoSliderValue">0 / 0</span>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
