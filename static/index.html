<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>汉诺塔</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="topbar" aria-label="游戏控制" data-i18n-aria-label="controlsLabel">
        <div>
          <div class="brand-row">
            <h1 id="appTitle" data-i18n="appTitle">汉诺塔</h1>
            <button id="languageButton" class="language-button" type="button">English</button>
          </div>
          <p id="statusText">加载中...</p>
        </div>

        <div class="controls">
          <label class="field">
            <span data-i18n="diskCountLabel">盘子数量</span>
            <input id="diskCount" type="number" min="2" max="16" value="3" />
          </label>
          <button id="newGameButton" type="button" data-i18n="newGameButton">新游戏</button>
          <button id="undoButton" type="button" data-i18n="undoButton">撤回上一步</button>
          <button id="demoButton" type="button" data-i18n="demoButton">教学演示</button>
          <div id="demoControls" class="demo-controls" hidden>
            <button id="demoPreviousButton" type="button" data-i18n="previousButton">上一步</button>
            <span id="demoProgress">0 / 0</span>
            <button id="demoNextButton" type="button" data-i18n="nextButton">下一步</button>
            <button id="demoExitButton" type="button" data-i18n="exitDemoButton">退出演示</button>
          </div>
        </div>
      </section>

      <section class="stats" aria-label="游戏统计" data-i18n-aria-label="statsLabel">
        <div>
          <span data-i18n="moveCountLabel">总步数</span>
          <strong id="moveCount">0</strong>
        </div>
        <div>
          <span data-i18n="elapsedTimeLabel">总时间</span>
          <strong id="elapsedTime">00:00</strong>
        </div>
        <div>
          <span data-i18n="minimumMovesLabel">最少步数</span>
          <strong id="minimumMoves">7</strong>
        </div>
      </section>

      <section class="board-panel" aria-label="汉诺塔棋盘" data-i18n-aria-label="boardLabel">
        <canvas id="board" width="1200" height="620"></canvas>
      </section>

      <section id="demoSliderPanel" class="demo-slider-panel" aria-label="教学演示进度" data-i18n-aria-label="demoProgressLabel" hidden>
        <label for="demoStepSlider" data-i18n="demoProgressLabel">演示进度</label>
        <input id="demoStepSlider" type="range" min="0" max="0" step="1" value="0" />
        <span id="demoSliderValue">0 / 0</span>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
