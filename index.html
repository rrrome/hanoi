<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>堆栈塔</title>
    <script>
      (() => {
        const savedTheme = window.localStorage.getItem("hanoi-theme");
        const theme = savedTheme === "dark" || savedTheme === "light" || savedTheme === "genshin"
          ? savedTheme
          : "genshin";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="genshin-theme.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="brand-row">
            <h1 id="appTitle" data-i18n="appTitle">堆栈塔</h1>
            <div class="top-actions">
              <button id="languageButton" class="secondary-button language-button" type="button">English</button>
              <button id="homeButton" class="secondary-button" type="button" data-i18n="homeButton" hidden>主页</button>
              <div class="theme-picker">
                <button id="themeButton" class="secondary-button theme-button" type="button" aria-haspopup="true" aria-expanded="false" aria-label="选择主题">主题</button>
                <div id="themeMenu" class="theme-menu" role="menu" hidden>
                  <button type="button" role="menuitemradio" data-theme-option="light">浅色</button>
                  <button type="button" role="menuitemradio" data-theme-option="dark">深色</button>
                  <button type="button" role="menuitemradio" data-theme-option="genshin">原神</button>
                </div>
              </div>
            </div>
            <p id="statusText" data-i18n="loading">加载中...</p>
          </div>
        </div>
      </header>

      <section id="homeView" class="home-view" hidden>
        <div class="home-content">
          <div class="home-intro">
            <p class="home-eyebrow" data-i18n="homeEyebrow">游戏规则</p>
            <h2 class="home-headline" data-i18n="homeHeadline">一次只移动一个盘子</h2>
            <p class="home-description" data-i18n="homeDescription">只能移动每根柱子最上方的盘子，大盘子不能放在小盘子上。将所有盘子移到目标柱即可完成。</p>
          </div>
          <div class="home-actions">
            <button id="homeNewGameButton" type="button" data-i18n="newGameButton">新游戏</button>
            <button id="homeDemoButton" type="button" data-i18n="demoButton">教学演示</button>
            <button id="homeSolverButton" type="button" data-i18n="solverButton">残局破解</button>
          </div>
          <p class="home-privacy" data-i18n="homePrivacy">所有计算均在浏览器本地完成</p>
        </div>
      </section>

      <section id="gameView" hidden>
        <div class="modebar">
          <div>
            <h2 id="modeTitle">新游戏</h2>
            <p id="modeSummary"></p>
          </div>
          <div class="mode-actions">
            <button id="undoButton" class="secondary-button" type="button" data-i18n="undoButton" hidden>上一步</button>
            <button id="redoButton" class="secondary-button" type="button" data-i18n="redoButton" hidden>下一步</button>
            <button id="confirmSetupButton" type="button" data-i18n="confirmSetupButton" hidden>确认残局</button>
            <div id="guideControls" class="guide-controls" hidden>
              <button id="previousButton" type="button" data-i18n="previousButton">上一步</button>
              <span id="guideProgress">0 / 0</span>
              <button id="nextButton" type="button" data-i18n="nextButton">下一步</button>
            </div>
          </div>
        </div>

        <section class="stats" aria-label="游戏统计" data-i18n-aria-label="statsLabel">
          <div>
            <span id="primaryStatLabel" data-i18n="moveCountLabel">总步数</span>
            <strong id="primaryStat">0</strong>
          </div>
          <div>
            <span data-i18n="elapsedTimeLabel">总时间</span>
            <strong id="elapsedTime">00:00</strong>
          </div>
          <div>
            <span id="minimumMovesLabel" data-i18n="minimumMovesLabel">最少步数</span>
            <strong id="minimumMoves">7</strong>
          </div>
        </section>

        <section class="board-panel" aria-label="堆栈塔棋盘" data-i18n-aria-label="boardLabel">
          <canvas id="board" width="1200" height="620"></canvas>
        </section>

        <section id="guideSliderPanel" class="guide-slider-panel" aria-label="演示进度" data-i18n-aria-label="guideProgressLabel" hidden>
          <label for="guideStepSlider" data-i18n="guideProgressLabel">演示进度</label>
          <input id="guideStepSlider" type="range" min="0" max="0" step="1" value="0" />
          <span id="guideSliderValue">0 / 0</span>
        </section>
      </section>
    </main>

    <div id="configModal" class="modal-backdrop" hidden>
      <div class="modal-frame">
        <span class="modal-corners" aria-hidden="true">
          <span class="modal-corner modal-corner-top-left"></span>
          <span class="modal-corner modal-corner-top-right"></span>
          <span class="modal-corner modal-corner-bottom-left"></span>
          <span class="modal-corner modal-corner-bottom-right"></span>
        </span>
        <form id="configForm" class="modal" novalidate>
          <h2 id="configTitle">新游戏</h2>
          <p id="configHint"></p>

          <label class="field disk-count-field">
            <span class="field-control-row disk-count-row">
              <span class="field-heading">
                <span data-i18n="diskCountLabel">盘子数量</span>
                <output id="modalDiskCountValue" for="modalDiskCount">7</output>
              </span>
              <span class="disk-count-control">
                <input id="modalDiskCount" type="range" min="2" max="10" step="1" value="7" aria-describedby="diskCountHint" required />
                <span class="range-limits" aria-hidden="true">
                  <span>2</span>
                  <span>10</span>
                </span>
              </span>
            </span>
            <small id="diskCountHint" data-i18n="diskCountHint">拖动滑块选择 2 到 10 个盘子。</small>
          </label>

          <div class="field">
            <div class="field-control-row position-control-row">
              <span data-i18n="initialPegLabel">初始盘子位置</span>
              <div id="initialPegButtons" class="peg-button-group" role="group" aria-label="初始盘子位置"></div>
            </div>
          </div>

          <div class="field">
            <div class="field-control-row position-control-row">
              <span data-i18n="targetPegLabel">目标盘子位置</span>
              <div id="targetPegButtons" class="peg-button-group" role="group" aria-label="目标盘子位置"></div>
            </div>
          </div>

          <p id="configError" class="form-error" role="alert"></p>

          <div class="modal-actions">
            <button class="secondary-button" type="button" id="cancelConfigButton">
              <span class="action-glyph action-glyph-cancel" aria-hidden="true"></span>
              <span class="action-label" data-i18n="cancelButton">取消</span>
            </button>
            <button type="submit" id="submitConfigButton">
              <span class="action-glyph action-glyph-start" aria-hidden="true"></span>
              <span class="action-label" data-i18n="startButton">开始</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="js/app.js?v=20260719-1"></script>
  </body>
</html>
